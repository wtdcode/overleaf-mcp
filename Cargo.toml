[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
overleaf-types = { path = "crates/overleaf-types" }
overleaf-client = { path = "crates/overleaf-client" }
overleaf-realtime = { path = "crates/overleaf-realtime" }
overleaf-tools = { path = "crates/overleaf-tools" }

chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
color-eyre = "0.6"
dotenvy = "0.15"
llmy = "0.20"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "multipart", "gzip"] }
rmcp = { version = "1", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
